name: Deploy to Production

on:
  workflow_dispatch:  # Tylko ręcznie (fallback). Auto-deploy idzie webhookiem GitHub -> /deploy/webhook
                      # (push przez SSH był loteryjny przez ochronę SSH Hostingera — patrz modules/deploy).

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.68.109
          port: 22
          username: woodpower-crm
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "=== Starting deployment (VPS) ==="
            cd /home/woodpower-crm/htdocs/crm.woodpower.pl || exit 1
            export FLASK_APP=app.py
            echo "Current directory: $(pwd)"

            # Zapamiętaj SHA przed pull
            OLD_HEAD=$(git rev-parse HEAD)

            # Pobierz najnowsze zmiany z Git (origin = SSH deploy key woodpower-crm)
            echo "=== Pulling latest changes ==="
            git fetch origin main
            git reset --hard origin/main

            NEW_HEAD=$(git rev-parse HEAD)
            echo "Deploy: $OLD_HEAD -> $NEW_HEAD"

            # Zależności (venv w katalogu aplikacji)
            echo "=== Checking dependencies ==="
            venv/bin/pip install -q -r requirements.txt 2>/dev/null || true

            # Synchronizacja changeloga (best-effort, nie failuje deploya)
            if [ "$OLD_HEAD" != "$NEW_HEAD" ]; then
              echo "=== Syncing changelog ==="
              venv/bin/flask sync-changelog --before "$OLD_HEAD" --after "$NEW_HEAD" || echo "[sync-warn] changelog sync failed (deploy continues)"
            else
              echo "=== Skipping changelog sync (no new commits) ==="
            fi

            # Restart aplikacji (gunicorn pod supervisorem; sudoers bez hasła)
            echo "=== Restarting application ==="
            sudo /usr/bin/supervisorctl restart crm_woodpower
            echo "Gunicorn restart triggered"

            echo "=== Deployment completed! ==="

      - name: Notify success
        if: success()
        run: echo "✅ Deployment successful!"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed!"
