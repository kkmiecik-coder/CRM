[crm]
url = https://crm.woodpower.pl
token = REPLACE_WITH_TOKEN_FROM_PANEL
jobs_limit = 10
request_timeout_seconds = 10

[printer]
ip = 192.168.100.199
port = 9100
send_timeout_seconds = 15

[polling]
; Zapasowy polling gdy kanał push NIE działa (broker padł / wyłączony w CRM).
; To dotychczasowe zachowanie agenta — awaria pusha nie może być wolniejsza
; niż stan sprzed jego wdrożenia.
interval_seconds = 10
; Zapasowy polling gdy kanał push DZIAŁA — sama siatka bezpieczeństwa na wypadek
; zgubionego sygnału. Zadania i tak przychodzą natychmiast po pushu.
push_idle_interval_seconds = 60
; Co ile sprawdzać, czy wróciliśmy w godziny pracy (poza oknem pracy).
idle_check_interval_seconds = 60

[realtime]
; Sygnał push z Centrifugo. Przy false agent zachowuje się jak przed wdrożeniem
; pusha (sam polling). Token do brokera agent pobiera sam z CRM — tu nic nie
; wpisujesz, wystarczy token z sekcji [crm].
enabled = true
; Zostaw puste — adres przyjeżdża z CRM. Wypełnij tylko awaryjnie, gdy trzeba
; przepiąć agenta na inny broker bez deployu CRM.
sse_url =

[schedule]
workdays_start = 05:30
workdays_end = 15:30
saturday_start = 05:30
saturday_end = 15:30
