<!-- modules/clients/templates/add_client_modal.html -->
<div id="clients-add-modal" class="clients-modal-overlay" style="display: none;">
    <div class="clients-modal clients-modal-tabs">
        <h2 class="title-with-underline-h2">Dodaj nowego klienta</h2>

        <!-- Nawigacja zakładek -->
        <div class="tabs-nav">
            <button type="button" class="tab-btn active" data-tab="tab-client-data">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                Dane klienta
            </button>
            <button type="button" class="tab-btn" data-tab="tab-delivery">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="1" y="3" width="15" height="13"/>
                    <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
                    <circle cx="5.5" cy="18.5" r="2.5"/>
                    <circle cx="18.5" cy="18.5" r="2.5"/>
                </svg>
                Adres dostawy
            </button>
            <button type="button" class="tab-btn" data-tab="tab-invoice">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                Dane do faktury
            </button>
        </div>

        <!-- Zawartość zakładek -->
        <div class="tabs-content">
            <!-- Zakładka 1: Dane klienta -->
            <div id="tab-client-data" class="tab-pane active">
                <div class="tab-pane-content">
                    <div class="input-group">
                        <label for="addClientName">Nazwa klienta *</label>
                        <input type="text" id="addClientName" class="clients-input" required placeholder="np. Wood Power Sp. z o.o.">
                        <p class="input-error" id="error-addClientName"></p>
                    </div>
                    <div class="input-group">
                        <label for="addClientDeliveryName">Imię i nazwisko</label>
                        <input type="text" id="addClientDeliveryName" class="clients-input" placeholder="np. Jan Kowalski">
                    </div>
                    <div class="input-group">
                        <label for="addClientEmail">Email</label>
                        <input type="email" id="addClientEmail" class="clients-input" placeholder="np. kontakt@firma.pl">
                        <p class="input-error" id="error-addClientEmail"></p>
                    </div>
                    <div class="input-group">
                        <label for="addClientPhone">Telefon</label>
                        <input type="text" id="addClientPhone" class="clients-input" placeholder="np. +48 123 456 789">
                        <p class="input-error" id="error-addClientPhone"></p>
                    </div>
                    <div class="input-group">
                        <label for="addClientNotes">Notatka o kliencie</label>
                        <textarea id="addClientNotes" class="clients-input clients-textarea" placeholder="Wpisz notatkę o kliencie..." rows="3"></textarea>
                    </div>
                </div>
            </div>

            <!-- Zakładka 2: Adres dostawy -->
            <div id="tab-delivery" class="tab-pane">
                <div class="tab-pane-header">
                    <button type="button" class="copy-invoice-btn" onclick="copyInvoiceToDeliveryAdd()" title="Kopiuj dane z faktury">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm-1 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h7v14z"/>
                        </svg>
                        Kopiuj z faktury
                    </button>
                </div>
                <div class="tab-pane-content grid-2-cols">
                    <div class="input-group">
                        <label for="addDeliveryName">Imię i nazwisko</label>
                        <input id="addDeliveryName" class="clients-input" type="text" placeholder="Odbiorca przesyłki">
                    </div>
                    <div class="input-group">
                        <label for="addDeliveryCompany">Firma</label>
                        <input id="addDeliveryCompany" class="clients-input" type="text" placeholder="Nazwa firmy">
                    </div>
                    <div class="input-group full-width">
                        <label for="addDeliveryAddress">Adres</label>
                        <input id="addDeliveryAddress" class="clients-input" type="text" placeholder="Ulica i numer">
                    </div>
                    <div class="input-group">
                        <label for="addDeliveryZip">Kod pocztowy</label>
                        <input id="addDeliveryZip" class="clients-input" type="text" placeholder="00-000" maxlength="6">
                        <p class="input-error" id="error-addDeliveryZip"></p>
                    </div>
                    <div class="input-group">
                        <label for="addDeliveryCity">Miasto</label>
                        <input id="addDeliveryCity" class="clients-input" type="text" placeholder="Miasto">
                    </div>
                    <div class="input-group">
                        <label for="addDeliveryRegion">Województwo</label>
                        <select id="addDeliveryRegion" class="clients-input clients-select">
                            <option value="">-- Wybierz województwo --</option>
                            <option value="dolnośląskie">dolnośląskie</option>
                            <option value="kujawsko-pomorskie">kujawsko-pomorskie</option>
                            <option value="lubelskie">lubelskie</option>
                            <option value="lubuskie">lubuskie</option>
                            <option value="łódzkie">łódzkie</option>
                            <option value="małopolskie">małopolskie</option>
                            <option value="mazowieckie">mazowieckie</option>
                            <option value="opolskie">opolskie</option>
                            <option value="podkarpackie">podkarpackie</option>
                            <option value="podlaskie">podlaskie</option>
                            <option value="pomorskie">pomorskie</option>
                            <option value="śląskie">śląskie</option>
                            <option value="świętokrzyskie">świętokrzyskie</option>
                            <option value="warmińsko-mazurskie">warmińsko-mazurskie</option>
                            <option value="wielkopolskie">wielkopolskie</option>
                            <option value="zachodniopomorskie">zachodniopomorskie</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="addDeliveryCountry">Kraj</label>
                        <select id="addDeliveryCountry" class="clients-input clients-select">
                            <option value="Polska" selected>Polska</option>
                            <option value="Niemcy">Niemcy</option>
                            <option value="Czechy">Czechy</option>
                            <option value="Słowacja">Słowacja</option>
                            <option value="Ukraina">Ukraina</option>
                            <option value="Litwa">Litwa</option>
                            <option value="Austria">Austria</option>
                            <option value="Belgia">Belgia</option>
                            <option value="Bułgaria">Bułgaria</option>
                            <option value="Chorwacja">Chorwacja</option>
                            <option value="Dania">Dania</option>
                            <option value="Estonia">Estonia</option>
                            <option value="Finlandia">Finlandia</option>
                            <option value="Francja">Francja</option>
                            <option value="Grecja">Grecja</option>
                            <option value="Hiszpania">Hiszpania</option>
                            <option value="Holandia">Holandia</option>
                            <option value="Irlandia">Irlandia</option>
                            <option value="Islandia">Islandia</option>
                            <option value="Luksemburg">Luksemburg</option>
                            <option value="Łotwa">Łotwa</option>
                            <option value="Malta">Malta</option>
                            <option value="Mołdawia">Mołdawia</option>
                            <option value="Norwegia">Norwegia</option>
                            <option value="Portugalia">Portugalia</option>
                            <option value="Rumunia">Rumunia</option>
                            <option value="Serbia">Serbia</option>
                            <option value="Słowenia">Słowenia</option>
                            <option value="Szwajcaria">Szwajcaria</option>
                            <option value="Szwecja">Szwecja</option>
                            <option value="Węgry">Węgry</option>
                            <option value="Wielka Brytania">Wielka Brytania</option>
                            <option value="Włochy">Włochy</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Zakładka 3: Dane do faktury -->
            <div id="tab-invoice" class="tab-pane">
                <div class="tab-pane-header">
                    <button type="button" class="copy-delivery-btn" onclick="copyDeliveryToInvoiceAdd()" title="Kopiuj dane z adresu dostawy">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                        </svg>
                        Kopiuj z dostawy
                    </button>
                </div>
                <div class="tab-pane-content grid-2-cols">
                    <div class="input-group">
                        <label for="addInvoiceName">Imię i nazwisko</label>
                        <input id="addInvoiceName" class="clients-input" type="text" placeholder="Dane do faktury">
                    </div>
                    <div class="input-group">
                        <label for="addInvoiceCompany">Firma</label>
                        <input id="addInvoiceCompany" class="clients-input" type="text" placeholder="Nazwa firmy">
                    </div>
                    <div class="input-group full-width">
                        <label for="addInvoiceAddress">Adres</label>
                        <input id="addInvoiceAddress" class="clients-input" type="text" placeholder="Ulica i numer">
                    </div>
                    <div class="input-group">
                        <label for="addInvoiceZip">Kod pocztowy</label>
                        <input id="addInvoiceZip" class="clients-input" type="text" placeholder="00-000">
                        <p class="input-error" id="error-addInvoiceZip"></p>
                    </div>
                    <div class="input-group">
                        <label for="addInvoiceCity">Miasto</label>
                        <input id="addInvoiceCity" class="clients-input" type="text" placeholder="Miasto">
                    </div>
                    <div class="input-group input-nip-group full-width">
                        <label for="addInvoiceNIP">NIP</label>
                        <div class="nip-row">
                            <input id="addInvoiceNIP" class="clients-input" type="text" placeholder="0000000000">
                            <button id="gusLookupBtn" type="button" class="gus-btn">Pobierz z GUS</button>
                        </div>
                        <p class="input-error" id="error-addInvoiceNIP"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="clients-modal-actions">
            <button id="clientsAddSaveBtn" type="button" class="clients-btn clients-btn-primary" onclick="console.log('[HTML onclick] Przycisk kliknięty!')">Zapisz klienta</button>
            <button id="clientsAddCancelBtn" class="clients-btn clients-btn-secondary">Anuluj</button>
        </div>
    </div>
</div>
