<!-- Changelog Widget z przyciskiem synchronizacji dla adminów -->
<div class="widget changelog-widget">
    <div class="changelog-header">
        <h2 class="widget-title">
            <span class="widget-icon">📢</span>
            Nowości w aplikacji
        </h2>
        {% if user and user.role == 'admin' %}
        <button class="changelog-sync-btn" id="changelog-sync-btn" title="Synchronizuj z GitHub">
            <span class="sync-icon">🔄</span>
        </button>
        {% endif %}
    </div>

    <div class="changelog-entries" id="changelog-entries">
        <div class="changelog-loading">Ładowanie nowości...</div>
    </div>
</div>
