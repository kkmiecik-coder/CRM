<!-- DXF Import Modal -->
<div class="dxf-import-overlay" id="dxf-import-overlay">
    <div class="dxf-modal">
        <div class="dxf-modal-header">
            <h3 class="dxf-modal-title">Importuj plik DXF</h3>
            <button class="dxf-modal-close" id="dxf-import-close">&times;</button>
        </div>
        <div class="dxf-modal-body">
            <div class="dxf-dropzone" id="dxf-dropzone">
                <input type="file" id="dxf-file-input" accept=".dxf" hidden>
                <div class="dxf-dropzone-icon">&#128194;</div>
                <div class="dxf-dropzone-text">Kliknij aby wybrać plik DXF</div>
                <div class="dxf-dropzone-hint">lub przeciągnij i upuść (max 10 MB)</div>
            </div>
            <div class="dxf-loading" id="dxf-loading">
                <div class="dxf-spinner"></div>
                <div class="dxf-loading-text">Analizowanie pliku DXF...</div>
            </div>
            <!-- Toolbar — widoczny po załadowaniu produktów -->
            <div class="dxf-toolbar" id="dxf-toolbar" style="display:none;">
                <!-- Unit toggle -->
                <div class="dxf-toolbar-group">
                    <span class="dxf-toolbar-label">Jednostka:</span>
                    <div class="dxf-unit-switch" id="dxf-unit-switch">
                        <button type="button" class="dxf-unit-opt" data-unit="mm">mm</button>
                        <button type="button" class="dxf-unit-opt active" data-unit="cm">cm</button>
                    </div>
                </div>
                <!-- Thickness for all -->
                <div class="dxf-toolbar-group" style="position:relative;">
                    <button type="button" class="dxf-toolbar-btn" id="dxf-thickness-btn">Dodaj grubość</button>
                    <div class="dxf-popover" id="dxf-thickness-popover" style="display:none;">
                        <label class="dxf-popover-label">Grubość (cm)</label>
                        <input type="number" step="0.1" min="0" id="dxf-thickness-input" class="dxf-popover-input" placeholder="np. 4">
                        <button type="button" class="dxf-popover-apply" id="dxf-thickness-apply">Zastosuj</button>
                    </div>
                </div>
                <!-- Variant for all -->
                <div class="dxf-toolbar-group" style="position:relative;">
                    <button type="button" class="dxf-toolbar-btn" id="dxf-variant-btn">Warianty</button>
                    <div class="dxf-popover dxf-popover-variant" id="dxf-variant-popover" style="display:none;">
                        <label class="dxf-popover-label">Wariant drewna</label>
                        <select id="dxf-variant-select" class="dxf-popover-select">
                            <option value="">— wybierz —</option>
                            <option value="dab-lity-ab">Dąb Lity A/B</option>
                            <option value="dab-lity-bb">Dąb Lity B/B</option>
                            <option value="dab-micro-ab">Dąb Mikrowczep A/B</option>
                            <option value="dab-micro-bb">Dąb Mikrowczep B/B</option>
                            <option value="jes-lity-ab">Jesion Lity A/B</option>
                            <option value="jes-micro-ab">Jesion Mikrowczep A/B</option>
                            <option value="buk-lity-ab">Buk Lity A/B</option>
                            <option value="buk-micro-ab">Buk Mikrowczep A/B</option>
                        </select>
                        <button type="button" class="dxf-popover-apply" id="dxf-variant-apply">Zastosuj</button>
                    </div>
                </div>
            </div>
            <div class="dxf-products-list" id="dxf-products-list"></div>
        </div>
        <div class="dxf-modal-footer" id="dxf-import-footer" style="display:none;">
            <button type="button" class="dxf-btn dxf-btn-cancel" id="dxf-cancel-btn">Anuluj</button>
            <button type="button" class="dxf-btn dxf-btn-import" id="dxf-confirm-btn">Dodaj do kalkulatora</button>
        </div>
    </div>
</div>
