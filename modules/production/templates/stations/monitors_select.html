<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Monitoring Zleceń — WoodPower</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.png') }}">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        body{
            font-family:-apple-system,system-ui,sans-serif;
            background:#111;
            color:#fff;
            height:100vh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
            -webkit-tap-highlight-color:transparent;
            -webkit-touch-callout:none;
            -webkit-user-select:none;
            user-select:none;
        }

        .hdr{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:6px;
            padding:18px 24px 14px;
            border-bottom:1px solid #222;
        }
        .hdr img{height:36px;width:auto;opacity:.85}
        .hdr h1{font-size:1rem;font-weight:500;color:#555;letter-spacing:.05em;text-transform:uppercase}

        .grid{
            flex:1;
            display:grid;
            grid-template-columns:repeat(3,1fr);
            grid-template-rows:repeat(2,1fr);
            gap:12px;
            padding:12px;
        }

        .s{
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:10px;
            background:#1a1a1a;
            border:2px solid #252525;
            border-left:5px solid var(--c);
            text-decoration:none;
            color:#fff;
            position:relative;
        }
        .s:active{background:#222}

        .s .nm{font-size:2rem;font-weight:700;letter-spacing:.02em;color:var(--c)}
        .s .desc{font-size:.9rem;color:#666;font-weight:400}

        .s.cut{--c:#e67e22}
        .s.asm{--c:#3498db}
        .s.glu{--c:#9b59b6}
        .s.fmt{--c:#e74c3c}
        .s.fin{--c:#1abc9c}
        .s.pak{--c:#27ae60}

        .s:active{border-left-color:var(--c);background:#1f1f1f}

        .ftr{
            padding:10px 24px;
            border-top:1px solid #222;
            text-align:center;
            font-size:.72rem;
            color:#444;
            letter-spacing:.04em;
        }

        @media(max-aspect-ratio:1/1){
            .grid{
                grid-template-columns:repeat(2,1fr);
                grid-template-rows:repeat(3,1fr);
            }
        }
    </style>
</head>
<body>

    <div class="hdr">
        <img src="/static/images/crm-logo.svg" alt="WP">
        <h1>WYBÓR MONITORINGU ZLECEŃ</h1>
    </div>

    <div class="grid">
        <a href="/production/stations/monitors/cutting" class="s cut">
            <span class="nm">Wycinanie</span>
            <span class="desc">Monitor zleceń wycinania</span>
        </a>
        <a href="/production/stations/monitors/assembly" class="s asm">
            <span class="nm">Składanie</span>
            <span class="desc">Monitor zleceń składania</span>
        </a>
        <a href="/production/stations/monitors/gluing" class="s glu">
            <span class="nm">Sklejanie</span>
            <span class="desc">Monitor zleceń sklejania</span>
        </a>
        <a href="/production/stations/monitors/formatting" class="s fmt">
            <span class="nm">Formatowanie</span>
            <span class="desc">Monitor zleceń formatowania</span>
        </a>
        <a href="/production/stations/monitors/finishing" class="s fin">
            <span class="nm">Wykańczanie</span>
            <span class="desc">Monitor zleceń wykańczania</span>
        </a>
        <a href="/production/stations/monitors/packaging" class="s pak">
            <span class="nm">Pakowanie</span>
            <span class="desc">Monitor zleceń pakowania</span>
        </a>
    </div>

    <div class="ftr">WOODPOWER CRM — MONITORING PRODUKCJI</div>

</body>
</html>
