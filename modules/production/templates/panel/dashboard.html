<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Produkcji - WoodPower CRM</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- CSS dla tabów -->
    <link rel="stylesheet" href="{{ url_for('production.static', filename='css/products-tab.css') }}?v=20260423">
    <link rel="stylesheet" href="{{ url_for('production.static', filename='css/archive-tab.css') }}?v=20260427">
    <link rel="stylesheet" href="{{ url_for('production.static', filename='css/production-panel.css') }}">
    <link rel="stylesheet" href="{{ url_for('production.static', filename='css/config-tab.css') }}">
    <!-- CSS dla komponentów -->
    <link rel="stylesheet" href="{{ url_for('production.static', filename='css/dashboard_bl_sync_modal.css') }}">
    <!-- CSS uzupełniające -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar systemowy -->
        {% include 'sidebar/sidebar.html' %}

        <!-- Main Content -->
        <main class="main-content">
            <!-- Production Tabs Bar -->
            <div class="production-tabs-bar">
                <nav class="nav nav-tabs" id="productionDashboardTabs" role="tablist">
                    <button class="nav-link active"
                            id="dashboard-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#dashboard-tab-content"
                            type="button" role="tab"
                            aria-controls="dashboard-tab-content"
                            aria-selected="true">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </button>
                    <button class="nav-link"
                            id="products-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#products-tab-content"
                            type="button" role="tab"
                            aria-controls="products-tab-content"
                            aria-selected="false">
                        <i class="fas fa-list me-2"></i>Lista produktów
                    </button>
                    <button class="nav-link"
                            id="archive-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#archive-tab-content"
                            type="button" role="tab"
                            aria-controls="archive-tab-content"
                            aria-selected="false">
                        <i class="fas fa-archive me-2"></i>Archiwum
                    </button>
                    <button class="nav-link"
                            id="reports-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#reports-tab-content"
                            type="button" role="tab"
                            aria-controls="reports-tab-content"
                            aria-selected="false">
                        <i class="fas fa-chart-bar me-2"></i>Raporty
                    </button>
                    <button class="nav-link"
                            id="config-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#config-tab-content"
                            type="button" role="tab"
                            aria-controls="config-tab-content"
                            aria-selected="false">
                        <i class="fas fa-cog me-2"></i>Konfiguracja
                    </button>
                </nav>
                <button class="tab-refresh-btn" id="tab-refresh-btn" title="Odśwież aktywną zakładkę">
                    <i class="fas fa-sync-alt refresh-icon"></i>
                    <span>Odśwież</span>
                </button>
            </div>

            <!-- Production Dashboard Tabs -->
            <div class="production-dashboard-tabs">

                <!-- Tab Content Container -->
                <div class="tab-content production-tab-content" id="productionDashboardTabContent">

                    <!-- Dashboard Tab -->
                    <div class="tab-pane fade show active"
                         id="dashboard-tab-content"
                         role="tabpanel"
                         aria-labelledby="dashboard-tab">

                        <div class="tab-skeleton" id="dashboard-tab-skeleton">
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; padding: 16px 0;">
                                <div class="skeleton-card"><div class="skeleton skeleton-text short"></div><div class="skeleton skeleton-stat"></div></div>
                                <div class="skeleton-card"><div class="skeleton skeleton-text short"></div><div class="skeleton skeleton-stat"></div></div>
                                <div class="skeleton-card"><div class="skeleton skeleton-text short"></div><div class="skeleton skeleton-stat"></div></div>
                                <div class="skeleton-card"><div class="skeleton skeleton-text short"></div><div class="skeleton skeleton-stat"></div></div>
                            </div>
                            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
                                <div class="skeleton-card" style="min-height: 200px;"><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-text long"></div><div class="skeleton skeleton-text medium"></div><div class="skeleton skeleton-text long"></div></div>
                                <div class="skeleton-card" style="min-height: 200px;"><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-text medium"></div><div class="skeleton skeleton-text short"></div><div class="skeleton skeleton-text medium"></div></div>
                            </div>
                        </div>

                        <div class="tab-content-wrapper" id="dashboard-tab-wrapper" style="display:none;">
                            <!-- Zawartość dashboard zostanie załadowana przez AJAX -->
                        </div>

                        <div class="tab-error" id="dashboard-tab-error" style="display:none;">
                            <div class="alert alert-danger" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <strong>Błąd ładowania dashboard!</strong>
                                <span id="dashboard-tab-error-message"></span>
                                <button class="btn btn-outline-danger btn-sm ms-2" onclick="ProductionApp.forceRefresh()">
                                    <i class="fas fa-redo me-1"></i>Spróbuj ponownie
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Products Tab -->
                    <div class="tab-pane fade"
                         id="products-tab-content"
                         role="tabpanel"
                         aria-labelledby="products-tab">

                        <div class="tab-skeleton" id="products-tab-skeleton">
                            <div style="padding: 16px 0;">
                                <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                                    <div class="skeleton skeleton-badge" style="width: 120px; height: 32px;"></div>
                                    <div class="skeleton skeleton-badge" style="width: 100px; height: 32px;"></div>
                                    <div class="skeleton skeleton-badge" style="width: 160px; height: 32px; margin-left: auto;"></div>
                                </div>
                                <div class="skeleton-card">
                                    <div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-text long" style="flex:1;margin:0;"></div><div class="skeleton skeleton-badge"></div></div>
                                    <div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-text long" style="flex:1;margin:0;"></div><div class="skeleton skeleton-badge"></div></div>
                                    <div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-text long" style="flex:1;margin:0;"></div><div class="skeleton skeleton-badge"></div></div>
                                    <div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-text long" style="flex:1;margin:0;"></div><div class="skeleton skeleton-badge"></div></div>
                                    <div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-text long" style="flex:1;margin:0;"></div><div class="skeleton skeleton-badge"></div></div>
                                    <div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-text long" style="flex:1;margin:0;"></div><div class="skeleton skeleton-badge"></div></div>
                                </div>
                            </div>
                        </div>

                        <div class="tab-content-wrapper" id="products-tab-wrapper" style="display:none;">
                            <!-- Zawartość produktów zostanie załadowana przez AJAX -->
                        </div>

                        <div class="tab-error" id="products-tab-error" style="display:none;">
                            <div class="alert alert-danger" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <strong>Błąd ładowania produktów!</strong>
                                <span id="products-tab-error-message"></span>
                                <button class="btn btn-outline-danger btn-sm ms-2" onclick="ProductionApp.forceRefresh()">
                                    <i class="fas fa-redo me-1"></i>Spróbuj ponownie
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Archive Tab -->
                    <div class="tab-pane fade"
                         id="archive-tab-content"
                         role="tabpanel"
                         aria-labelledby="archive-tab">

                        <div class="tab-skeleton" id="archive-tab-skeleton">
                            <div style="padding: 16px 0;">
                                <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                                    <div class="skeleton skeleton-badge" style="width: 120px; height: 32px;"></div>
                                    <div class="skeleton skeleton-badge" style="width: 100px; height: 32px;"></div>
                                    <div class="skeleton skeleton-badge" style="width: 160px; height: 32px; margin-left: auto;"></div>
                                </div>
                                <div class="skeleton-card">
                                    <div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-text long" style="flex:1;margin:0;"></div><div class="skeleton skeleton-badge"></div></div>
                                    <div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-text long" style="flex:1;margin:0;"></div><div class="skeleton skeleton-badge"></div></div>
                                    <div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-text long" style="flex:1;margin:0;"></div><div class="skeleton skeleton-badge"></div></div>
                                    <div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-text long" style="flex:1;margin:0;"></div><div class="skeleton skeleton-badge"></div></div>
                                </div>
                            </div>
                        </div>

                        <div class="tab-content-wrapper" id="archive-tab-wrapper" style="display:none;">
                            <!-- Zawartość archiwum zostanie załadowana przez AJAX -->
                        </div>

                        <div class="tab-error" id="archive-tab-error" style="display:none;">
                            <div class="alert alert-danger" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <strong>Błąd ładowania archiwum!</strong>
                                <span id="archive-tab-error-message"></span>
                                <button class="btn btn-outline-danger btn-sm ms-2" onclick="ProductionApp.forceRefresh()">
                                    <i class="fas fa-redo me-1"></i>Spróbuj ponownie
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Reports Tab -->
                    <div class="tab-pane fade"
                         id="reports-tab-content"
                         role="tabpanel"
                         aria-labelledby="reports-tab">

                        <div class="tab-loading" id="reports-tab-loading">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                                <p class="mt-3 text-muted">Ładowanie raportów...</p>
                            </div>
                        </div>

                        <div class="tab-content-wrapper" id="reports-tab-wrapper" style="display:none;">
                            <!-- Zawartość raportów zostanie załadowana przez AJAX -->
                        </div>

                        <div class="tab-error" id="reports-tab-error" style="display:none;">
                            <div class="alert alert-danger" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <strong>Błąd ładowania raportów!</strong>
                                <span id="reports-tab-error-message"></span>
                                <button class="btn btn-outline-danger btn-sm ms-2" onclick="ProductionApp.forceRefresh()">
                                    <i class="fas fa-redo me-1"></i>Spróbuj ponownie
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Config Tab (tylko admin) -->
                    <div class="tab-pane fade"
                         id="config-tab-content"
                         role="tabpanel"
                         aria-labelledby="config-tab">

                        <div class="tab-loading" id="config-tab-loading">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                                <p class="mt-3 text-muted">Ładowanie konfiguracji...</p>
                            </div>
                        </div>

                        <div class="tab-content-wrapper" id="config-tab-wrapper" style="display:none;">
                            <!-- Zawartość konfiguracji zostanie załadowana przez AJAX -->
                        </div>

                        <div class="tab-error" id="config-tab-error" style="display:none;">
                            <div class="alert alert-danger" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <strong>Błąd ładowania konfiguracji!</strong>
                                <span id="config-tab-error-message"></span>
                                <button class="btn btn-outline-danger btn-sm ms-2" onclick="ProductionApp.forceRefresh()">
                                    <i class="fas fa-redo me-1"></i>Spróbuj ponownie
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ========================================= -->
    <!-- NOWA STRUKTURA ŁADOWANIA SKRYPTÓW       -->
    <!-- ========================================= -->
    <!-- 1. Podstawowe biblioteki -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. Sidebar (niezmieniony) -->
    <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>

    <!-- 3. Chart.js tylko dla adminów -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- 4. NOWE: Konfiguracja aplikacji -->
    <script>
    window.PRODUCTION_CONFIG = {
        user: {
            role: '{{ current_user.role if current_user.is_authenticated else "guest" }}',
            id: {{ current_user.id if current_user.is_authenticated else 'null' }},
            isAdmin: {{ 'true' if current_user.role in ['admin', 'administrator'] else 'false' }},
            name: '{{ current_user.username if current_user.is_authenticated else "Gość" }}'
        },
        endpoints: {
            dashboardTabContent: '{{ url_for("production.production_api.dashboard_tab_content") }}',
            productsTabContent: '{{ url_for("production.production_api.products_tab_content") }}',
            reportsTabContent: '{{ url_for("production.production_api.reports_tab_content") }}',
            configTabContent: '{{ url_for("production.production_api.config_tab_content") }}',
            chartData: '{{ url_for("production.production_api.chart_data") }}',
            manualSync: '{{ url_for("production.production_api.manual_sync") }}',
            dashboardStats: '{{ url_for("production.production_api.dashboard_stats") }}',
            systemErrors: {% if current_user.role in ['admin', 'administrator'] %}'{{ url_for("production.production_admin.ajax_system_errors") }}'{% else %}null{% endif %},
            clearSystemErrors: {% if current_user.role in ['admin', 'administrator'] %}'{{ url_for("production.production_admin.ajax_clear_system_errors") }}'{% else %}null{% endif %}
        },
        debug: {{ config.DEBUG|lower }},
        version: '2.0.0',
        environment: '{{ config.ENV or "production" }}'
    };

    console.log('[HTML] Production config loaded:', window.PRODUCTION_CONFIG);
    </script>

    <!-- ATTACHMENT MODAL -->
    <div id="attachmentModal" class="attachment-modal-admin">
        <div class="modal-close-admin" onclick="closeAttachmentModalAdmin()">&times;</div>
        <div class="modal-content-admin" id="modalAttachmentContentAdmin"></div>
    </div>

    <!-- Wspólne serwisy -->
    <script src="{{ url_for('production.static', filename='js/shared-services.js') }}"></script>
    <!-- Moduły funkcjonalne -->
    <script src="{{ url_for('production.static', filename='js/modules/dashboard-module.js') }}?v=20260410"></script>
    <script src="{{ url_for('production.static', filename='js/modules/products-dragdrop.js') }}?v=20260410"></script>
    <script src="{{ url_for('production.static', filename='js/modules/barcode-scanner.js') }}?v=20260423"></script>
    <script src="{{ url_for('production.static', filename='js/modules/products-module.js') }}?v=20260423"></script>
    <script src="{{ url_for('production.static', filename='js/modules/archive-module.js') }}?v=20260427"></script>
    <script src="{{ url_for('production.static', filename='js/modules/config-module.js') }}?v=20260410"></script>
    <!-- Główny kontroler aplikacji -->
    <script src="{{ url_for('production.static', filename='js/production-app-loader.js') }}"></script>
    <!-- Obsługa modala synchronizacji z Baselinkerem -->
    <script src="{{ url_for('production.static', filename='js/modules/dashboard_bl_sync_modal.js') }}"></script>
    <!-- Obsługa załączników produktów -->
    <script src="{{ url_for('production.static', filename='js/modules/products-attachments.js') }}"></script>

</body>
</html>
