services:
  app:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    environment:
      FLASK_APP: app.py
      FLASK_DEBUG: "1"
    volumes:
      - ./:/app:cached
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: woodpower_crm_local
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
