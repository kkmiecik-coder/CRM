location /realtime/api {
    # Server API brokera zostaje wyłącznie na localhoście — CRM publikuje
    # bezpośrednio na 127.0.0.1:8091. Publiczny dostęp tutaj oznaczałby, że
    # ktoś z kluczem API może rozgłaszać na kanały hali.
    return 403;
}

location /realtime/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE: bez tego nginx zbuforuje strumień i sygnał dojedzie z opóźnieniem
    # (albo wcale) — czyli dokładnie to, co ten mechanizm miał usunąć.
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;

    # Połączenie jest długożyjące — domyślne 60 s zrywałoby je co minutę.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
