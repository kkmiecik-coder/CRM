; Centrifugo — broker sygnałów realtime dla CRM.
; Na serwerze: /etc/supervisor/conf.d/centrifugo.conf
;
; Po zmianie: supervisorctl reread && supervisorctl update
[program:centrifugo]
command=/opt/centrifugo/centrifugo --config /etc/centrifugo/config.json
directory=/opt/centrifugo
user=woodpower-crm
autostart=true
autorestart=true
startsecs=5
startretries=999
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/centrifugo/centrifugo.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
